<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo Loop Demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f6; color: #222; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 16px; }
    .stage { display: grid; place-items: center; padding: 24px; border-radius: 12px; min-height: 480px; }
    .stage p { margin: 8px 0 0; font-size: 13px; opacity: .7; }
    .light { background: #ffffff; }
    .dark { background: #0d0d12; color: #eee; }
    .check { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 24px 24px; }
    header { padding: 16px 16px 0; font-size: 14px; }

    /* --- snippet styles --- */
    .logo-loop { width: 100%; max-width: 450px; aspect-ratio: 1; }
    .logo-loop video, .logo-loop img { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>Format aktif: <b id="mode"></b> &middot; paksa: <a href="?">auto</a> / <a href="?force=webm">webm</a> / <a href="?force=webp">webp</a> / <a href="?force=static">static</a></header>
  <main>
    <div class="stage light"><div class="logo-loop"></div><p>Background putih</p></div>
    <div class="stage dark"><div class="logo-loop"></div><p>Background gelap</p></div>
    <div class="stage check"><div class="logo-loop"></div><p>Pola kotak (cek transparansi)</p></div>
  </main>

  <script>
    // --- snippet script: pick the right transparent format per browser ---
    (function () {
      var force = new URLSearchParams(location.search).get("force");
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      // WebKit (Safari, and every browser on iOS) ignores VP9 alpha: use animated WebP there.
      var webkit = /Apple/.test(navigator.vendor);
      var mode = force || (reduce ? "static" : webkit ? "webp" : "webm");
      document.getElementById("mode").textContent = mode;

      document.querySelectorAll(".logo-loop").forEach(function (box) {
        var el;
        if (mode === "webm") {
          el = document.createElement("video");
          el.src = "logo-loop.webm";
          el.autoplay = el.muted = el.loop = el.playsInline = true;
          el.setAttribute("aria-hidden", "true");
        } else {
          el = document.createElement("img");
          el.src = mode === "webp" ? "logo-loop.webp" : "logo-static.webp";
          el.alt = "";
        }
        el.width = el.height = 450;
        box.appendChild(el);
      });
    })();
  </script>
</body>
</html>
